spring.application.name=AutoRent

# ---- Base de datos (local: XAMPP; en Railway se definen DB_URL, DB_USERNAME y DB_PASSWORD) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autorent_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Aislamiento READ COMMITTED: cada consulta ve lo último que otras transacciones ya guardaron.
# MySQL usa por defecto REPEATABLE READ (una "foto" tomada en la primera lectura), y con esa foto
# la verificación de cruce de fechas no veía reservas recién creadas por otra persona al mismo tiempo.
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
# Railway (y casi todos los hostings) indican el puerto con la variable PORT.
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Detrás del proxy HTTPS de Railway: así Spring sabe que la página original es https.
server.forward-headers-strategy=framework

# ---- Zona horaria del negocio (el servidor en la nube suele estar en UTC) ----
autorent.zona-horaria=${AUTORENT_ZONA_HORARIA:America/Lima}

# ---- Datos de la empresa (ficticios, para boletas) ----
autorent.empresa.ruc=${EMPRESA_RUC:20123456786}
autorent.empresa.razon-social=${EMPRESA_RAZON_SOCIAL:CAPLINA RENT A CAR S.A.C.}
autorent.empresa.direccion=${EMPRESA_DIRECCION:Av. Bolognesi 1250, Tacna - Tacna - Tacna}

# ---- Yape de la empresa (número de prueba) ----
autorent.yape.numero=999000000
autorent.yape.titular=AutoRent

# ---- Reglas de tiempo ----
autorent.reservas.horas-para-pagar=24
autorent.pagos.minutos-pago-en-linea=30
autorent.tareas.intervalo-ms=300000

# ---- PayPal Sandbox (vacío = solo pasarela de tarjeta de prueba). Credenciales en developer.paypal.com ----
autorent.paypal.client-id=${PAYPAL_CLIENT_ID:}
autorent.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
autorent.paypal.url=${PAYPAL_URL:https://api-m.sandbox.paypal.com}
autorent.paypal.moneda=USD
autorent.paypal.tipo-cambio=${PAYPAL_TIPO_CAMBIO:3.75}

# ---- Nubefact (vacío = boletas en modo de prueba interno). RUTA y TOKEN de la cuenta demo de nubefact.com ----
autorent.nubefact.ruta=${NUBEFACT_RUTA:}
autorent.nubefact.token=${NUBEFACT_TOKEN:}
autorent.nubefact.serie-boleta=${NUBEFACT_SERIE_BOLETA:BBB1}
autorent.nubefact.serie-nota-credito=${NUBEFACT_SERIE_NOTA:BBB1}
autorent.comprobantes.serie-boleta=B001
autorent.comprobantes.serie-nota-credito=BC01

# ---- Contraseñas de las cuentas de demostración (cámbielas en un servidor público) ----
autorent.demo.clave-admin=${CLAVE_ADMIN:Admin123*}
autorent.demo.clave-trabajador=${CLAVE_TRABAJADOR:Trabajador123*}
autorent.demo.clave-cliente=${CLAVE_CLIENTE:Cliente123*}
# Cuentas para la presentación (docente y compañeros). Sin variable de entorno, la cuenta no se crea.
autorent.demo.clave-docente=${CLAVE_DOCENTE:}
autorent.demo.clave-curso-trabajador=${CLAVE_CURSO_TRABAJADOR:}
autorent.demo.clave-curso-cliente=${CLAVE_CURSO_CLIENTE:}

# ---- Fotos de vehículos (en Railway apunte a un volumen persistente, por ejemplo /data/imagenes) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
autorent.imagenes.directorio=${IMAGENES_DIRECTORIO:${user.home}/AutoRent/imagenes}
