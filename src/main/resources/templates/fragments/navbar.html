<!DOCTYPE html>
<!-- Fragmento de navegación visible según el rol. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav class="navbar" th:fragment="navbar">
    <a class="brand" th:href="@{/}">AutoRent</a>
    <div class="navlinks">
        <a th:href="@{/autos}">Vehículos</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/inicio}">Inicio</a>
        <a sec:authorize="hasRole('CLIENTE')" th:href="@{/mis-reservas}">Mis reservas</a>
        <a sec:authorize="hasRole('CLIENTE')" th:href="@{/mi-cuenta}">Mis datos</a>
        <a sec:authorize="hasAnyRole('ADMIN','TRABAJADOR')" th:href="@{/operaciones/reservas}">Operaciones</a>
        <a sec:authorize="hasAnyRole('ADMIN','TRABAJADOR')" th:href="@{/operaciones/clientes}">Clientes</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/autos}">Autos</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/mantenimiento}">Mantenimiento</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/usuarios}">Usuarios</a>
        <a sec:authorize="hasAnyRole('ADMIN','TRABAJADOR')" th:href="@{/operaciones/comprobantes}">Comprobantes</a>
        <a sec:authorize="hasAnyRole('ADMIN','TRABAJADOR')" th:href="@{/operaciones/caja}">Caja</a>
        <a sec:authorize="hasAnyRole('ADMIN','TRABAJADOR')" th:href="@{/reportes}">Reportes</a>
    </div>
    <div class="navuser">
        <span sec:authorize="isAuthenticated()">Hola, <strong sec:authentication="name">
</strong>
</span>
        <a sec:authorize="isAnonymous()" th:href="@{/login}">Ingresar</a>
        <a sec:authorize="isAnonymous()" th:href="@{/registro}">Crear cuenta</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="inline-form">
            <button class="link-button" type="submit">Salir</button>
        </form>
    </div>
    <script th:src="@{/js/validaciones.js}" defer></script>
</nav>
</body>
</html>
