<!DOCTYPE html>
<!-- Vehículos: listado administrativo y cambios de estado. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrar autos | AutoRent</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}">
</div>
<main class="container">
    <div th:replace="~{fragments/alerts :: alerts}">
</div>
    <div class="section-head">
<div>
<p class="eyebrow">ADMINISTRACIÓN</p>
<h1>Gestión de vehículos</h1>
</div>
<a class="btn primary" th:href="@{/admin/autos/nuevo}">+ Registrar vehículo</a>
</div>
    <div class="table-wrap">
<table>
<thead>
<tr>
<th>Placa</th>
<th>Vehículo</th>
<th>Categoría</th>
<th>Tarifa diaria</th>
<th>Estado</th>
<th>Días ocupados</th>
<th>Acciones</th>
</tr>
</thead>
<tbody>
        <tr th:each="auto : ${autos}">
<td th:text="${auto.placa}">
</td>
<td>
<div class="auto-list-item">
            <img th:src="${auto.imagenUrl != null} ? ${auto.imagenUrl} : @{/autos/{id}/ilustracion.svg(id=${auto.id})}" th:data-respaldo="@{/autos/{id}/ilustracion.svg(id=${auto.id})}" onerror="if(this.src.indexOf('ilustracion')<0){this.src=this.dataset.respaldo}" class="auto-thumb" th:alt="|${auto.marca} ${auto.modelo}|" loading="lazy">
            <span th:text="|${auto.marca} ${auto.modelo} (${auto.anio})|">
</span>
        </div>
</td>
<td th:text="${auto.categoria}">
</td>
<td th:text="|S/ ${#numbers.formatDecimal(auto.tarifaDiaria,1,2)}|">
</td>
<td th:with="periodos=${ocupacion[auto.id]}, fuera=${periodos != null and !periodos.?[enCurso()].isEmpty() ? periodos.?[enCurso()][0] : null}">
<!-- Si el auto está habilitado pero ahora mismo está fuera, se muestra ALQUILADO y cuándo vuelve. -->
<th:block th:if="${fuera != null and auto.estado.name() == 'DISPONIBLE'}">
<span class="status orange">ALQUILADO</span>
<br><small th:class="${fuera.atrasado(hoy) ? 'text-danger' : 'muted'}" th:text="${fuera.atrasado(hoy) ? '¡Atrasado! Debía volver el ' + fuera.finTexto() : 'Vuelve el ' + fuera.finTexto()}">Vuelve el 20/11/2026</small>
</th:block>
<span th:unless="${fuera != null and auto.estado.name() == 'DISPONIBLE'}" class="status" th:text="${auto.estado.name() == 'MANTENIMIENTO' ? 'EN TALLER' : auto.estado}" th:classappend="${auto.estado.name() == 'DISPONIBLE' ? 'green' : (auto.estado.name() == 'MANTENIMIENTO' ? 'orange' : 'gray')}">
</span>
</td>
<td th:with="periodos=${ocupacion[auto.id]}">
<span th:if="${periodos == null or periodos.isEmpty()}" class="muted">Libre</span>
<ul class="lista-compacta" th:unless="${periodos == null or periodos.isEmpty()}">
<li th:each="p, it : ${periodos}" th:if="${it.index < 4}">
<span th:text="${p.texto()}">25/11/2026 al 27/11/2026</span>
<small class="muted" th:text="|(${p.etiqueta()})|">(reservado)</small>
</li>
<li th:if="${periodos.size() > 4}" class="muted" th:text="|y ${periodos.size() - 4} más|">y 2 más</li>
</ul>
</td>
        <td class="actions">
<a class="btn small outline" th:href="@{/admin/autos/{id}/editar(id=${auto.id})}">Editar</a>
            <form th:if="${auto.estado.name() != 'MANTENIMIENTO'}" th:action="@{/admin/autos/{id}/estado(id=${auto.id})}" method="post" class="inline-form">
<input type="hidden" name="estado" th:value="${auto.estado.name() == 'DISPONIBLE' ? 'INACTIVO' : 'DISPONIBLE'}">
<button class="btn small secondary" type="submit" th:text="${auto.estado.name() == 'DISPONIBLE' ? 'Desactivar' : 'Activar'}">
</button>
</form>
            <a class="btn small secondary" th:href="@{/admin/mantenimiento}">Mantenimiento</a>
        </td>
</tr>
    </tbody>
</table>
</div>
</main>
</body>
</html>
