spring.datasource.url=jdbc:h2:mem:autorent_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.thymeleaf.cache=true

autorent.imagenes.directorio=${java.io.tmpdir}/autorent-pruebas-imagenes

# En las pruebas las tareas automáticas se ejecutan a mano (no en segundo plano).
autorent.tareas.habilitadas=false
